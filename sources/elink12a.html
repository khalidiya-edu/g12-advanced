<!DOCTYPE html>
<html lang="en">
<head><!-- /frame-runtime -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 12 Advanced – End-of-Term 1 English Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4338ca; --accent2:#6366f1; --soft:#eef0fd;
  --ink:#1c2230; --muted:#5d6678; --line:#e3e6ee; --bg:#f6f7fb; --card:#fff;
  --ok:#15803d; --okbg:#e8f6ec; --bad:#b42318; --badbg:#fdecea; --warn:#b45309; --warnbg:#fff4e0;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
button{font:inherit;cursor:pointer}
textarea,input{font:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0}
/* header */
.top{background:var(--accent);color:#fff;padding:22px 20px 0;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:var(--accent2);opacity:.35}
.top-in{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.top h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600}
.scorebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.meter{flex:1;min-width:160px;max-width:320px;height:9px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .4s}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#fff;text-decoration:none;padding:11px 15px;border-radius:12px 12px 0 0;font-weight:600;font-size:14.5px;white-space:nowrap;opacity:.82}
nav a:hover{opacity:1;background:rgba(255,255,255,.12)}
nav a.on{background:var(--bg);color:var(--accent);opacity:1}
main{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.h2{font-size:24px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h3{font-size:18px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* overview table */
table.ov{width:100%;border-collapse:collapse;font-size:15px}
table.ov th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
table.ov td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.ov td.m{font-weight:800;color:var(--accent);text-align:right;white-space:nowrap}
table.ov a{color:var(--accent);font-weight:700;text-decoration:none}
.bigstat{display:flex;gap:14px;flex-wrap:wrap}
.bigstat div{flex:1;min-width:140px;background:var(--soft);border-radius:12px;padding:14px 16px}
.bigstat b{display:block;font-size:26px;color:var(--accent)}
/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;padding:14px;backface-visibility:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.flip .f{background:#fff;justify-content:center;align-items:center;text-align:center}
.flip .f b{font-size:19px;color:var(--accent)}
.flip .f span{font-size:12px;color:var(--muted);margin-top:6px}
.flip .b{background:var(--soft);transform:rotateY(180deg);font-size:13.5px;overflow:auto}
.flip .b em{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
.grouph{font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.grouph:first-child{margin-top:0}
/* passage */
.passage{font-family:"Literata",Georgia,serif;font-size:17px;line-height:1.8;background:#fffdf8;border:1px solid #efe7d6;border-radius:var(--r);padding:22px 24px}
.passage h3{font-family:"Plus Jakarta Sans",sans-serif;text-align:center;font-size:19px;margin-bottom:12px;color:var(--accent)}
.passage p{margin:0 0 14px}
.passage p .pn{font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.gap{display:inline-block;min-width:96px;border-bottom:2px dashed var(--accent);padding:0 6px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;font-size:15px;color:var(--accent);text-align:center;line-height:1.5}
.gap.ok{border-bottom:2px solid var(--ok);color:var(--ok);background:var(--okbg);border-radius:4px 4px 0 0}
.gap.bad{border-bottom:2px solid var(--bad);color:var(--bad);background:var(--badbg);border-radius:4px 4px 0 0}
.readwrap{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start}
.readwrap .passage{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
@media(max-width:900px){.readwrap{grid-template-columns:1fr}.readwrap .passage{position:static;max-height:none}}
/* questions */
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:12px}
.q .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.q .num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
.q .qt{font-weight:600}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:15px;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt .L{flex:none;font-weight:800;color:var(--accent);width:18px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .L{color:var(--bad)}
.opts.inline{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.opts.inline{grid-template-columns:1fr}}
.why{display:none;margin-top:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:#5a3a06}
.why.show{display:block}
.why b.okt{color:var(--ok)} .why b.badt{color:var(--bad)}
.secscore{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:12px 16px;margin:6px 0 18px;font-weight:600}
.secscore b{color:var(--accent);font-size:18px}
/* grammar */
details.gp{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.gp summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:700}
details.gp summary::-webkit-details-marker{display:none}
details.gp summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--accent);font-weight:400}
details.gp[open] summary::after{content:"–"}
details.gp .body{padding:0 16px 16px}
.rule{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ex{margin:4px 0 12px;padding-left:18px}
.ex li{margin-bottom:4px}
.ex u{text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
/* writing */
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;min-height:140px;line-height:1.6;background:#fff}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea.plan{min-height:58px}
.counter{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted);margin:8px 0 4px}
.counter b{color:var(--ink)}
.prog{height:8px;flex:1;min-width:140px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--warn);transition:width .3s}
.prog i.done{background:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.phr{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 14px}
.phr button{border:1px dashed var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600}
.phr button:hover{background:var(--soft)}
.model{display:none;background:#f3fbf5;border:1px solid #cbe9d4;border-radius:12px;padding:14px 16px;margin-top:10px}
.model.show{display:block}
.model p{margin:0 0 10px}
.rub{width:100%;border-collapse:collapse;font-size:14.5px}
.rub td{padding:8px 6px;border-bottom:1px solid var(--line)}
.rub select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line)}
.rub tr.tot td{font-weight:800;border-bottom:0;color:var(--accent)}
.prompt{border-left:4px solid var(--accent);background:#fff;padding:14px 16px;border-radius:0 12px 12px 0;margin-bottom:14px}
.prompt ul{margin:8px 0 6px;padding-left:20px}
/* tips */
.tip h4{font-size:16px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.tip ul{margin:6px 0 0;padding-left:18px}
.tip li{margin-bottom:5px}
.skillbar{display:grid;grid-template-columns:170px 1fr 60px;gap:10px;align-items:center;margin-bottom:9px;font-size:14.5px}
.skillbar .prog i{background:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;transition:.3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.quizbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.quizdef{font-size:18px;font-weight:600;margin:6px 0 12px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="eyebrow">English · End-of-Term 1 Revision · 2026–2027</div>
    <h1 id="ttl"></h1>
    <div class="chips" id="chips"></div>
    <div class="scorebar">
      <span>Mock exam (Parts 1–3): <b id="mockTop">0</b> / 60</span>
      <span class="meter"><i id="mockBar"></i></span>
      <span id="answeredTop" style="opacity:.85"></span>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main"></main>
<footer>Practice material written to match the Cycle 3 End-of-Term 1 Test Specifications. The real exam uses different texts.</footer>
<div class="toast" id="toast"></div>

<script>
const D = {"grade": "Grade 12 Advanced", "short": "G12 Advanced", "stage": "Stage 9", "cefr": "B2.2", "accent": "#4338ca", "accent2": "#6366f1", "soft": "#eef0fd", "themes": ["Pushing Boundaries", "Rise to the Challenge!"], "parts": [["Part 1", "Vocabulary", "Multiple-choice gap fill: 1 text (~180 words), 5 gaps, A/B/C", "5 × 2", 10], ["Part 2", "Grammar", "Multiple-choice gap fill: 1 expository text (~180 words), 5 gaps, A/B/C. Theme: My roof is alive!", "5 × 2", 10], ["Part 3A", "Reading (at level)", "1 argumentative text (330–350 words, B2.2), 8 questions, A/B/C. Theme: Personality – Nature or Nurture?", "8 × 3", 24], ["Part 3B", "Reading (beyond level)", "1 expository text (330–350 words, C1.1), 8 questions, A/B/C. Theme: Megacities and Small Towns", "8 × 2", 16], ["Part 4.1", "Writing – compare & summarise", "Read a ~200-word text with TWO points of view. Compare and contrast them in your own words (4–5 sentences).", "", 15], ["Part 4.2", "Writing – comparative essay", "Comparative essay with 3 prompts, at least 220 words, in paragraphs.", "", 25]], "writing_themes": "Rise to the Challenge – Smart Homes  |  Rise to the Challenge – Comparing Places: A Critical Response", "vocab_groups": [{"theme": "Pushing Boundaries", "words": [["privacy", "the right to keep your personal life and information secret", "Many users worry about the privacy of their data online."], ["freedom", "the right to act, speak or think as you want", "Remote work gives employees more freedom to plan their day."], ["automation", "using machines or computers to do work without people", "Automation has replaced many factory jobs."], ["cost-effective", "giving good results for the amount of money spent", "Solar panels are a cost-effective way to cut electricity bills."], ["interruptions", "things that stop an activity for a short time", "I can’t study with constant interruptions from my phone."], ["distractions", "things that take your attention away from what you are doing", "Social media is one of the biggest distractions for students."], ["voyage", "a long journey, especially by sea or into space", "The voyage to Mars would take about seven months."], ["destination", "the place someone or something is going to", "Dubai is a popular tourist destination."], ["heritable", "able to be passed from parents to children through genes", "Eye colour is a heritable characteristic."], ["significant", "important or large enough to be noticed", "Exercise has a significant effect on mood."], ["consequence", "a result of an action, often a bad one", "Lack of sleep can have serious consequences for your health."], ["database", "a large, organised collection of information stored on a computer", "The hospital keeps patient records in a secure database."]]}, {"theme": "Rise to the Challenge!", "words": [["megacity", "a city with more than 10 million people", "Tokyo is one of the largest megacities in the world."], ["urbanisation", "the process of more and more people moving to live in cities", "Rapid urbanisation puts pressure on housing."], ["congestion", "too much traffic or too many people in one place", "Traffic congestion makes the morning commute very long."], ["pollution", "damage to air, water or land caused by harmful substances", "Car exhaust is a major cause of air pollution."], ["infrastructure", "basic systems a city needs, e.g. roads, water, electricity", "The government is investing in new infrastructure."], ["innovative", "using new and creative ideas or methods", "The city uses an innovative system to recycle water."], ["kinaesthetic", "learning by doing and moving, using the body", "Kinaesthetic learners remember more when they build models."], ["auditory", "related to hearing; learning by listening", "Auditory learners benefit from podcasts and discussions."], ["insulation", "material that stops heat, cold or sound from passing through", "Good insulation keeps the house cool in summer."], ["drainage", "a system that removes extra water from an area", "Poor drainage caused flooding after the storm."], ["biodiversity", "the variety of plants and animals living in an area", "Mangrove forests support rich biodiversity."], ["vegetation", "plants in general, especially those in a particular area", "The desert has very little vegetation."]]}, {"theme": "My roof is alive! (Part 2 text)", "words": [["living roof", "a roof covered with soil and growing plants", "The new library has a living roof full of wildflowers."], ["rooftop", "the outside top surface of a building", "They built a small garden on the rooftop."], ["absorb", "take in a liquid, heat or energy", "Plants absorb rainwater and carbon dioxide."], ["urban heat", "extra heat in cities caused by buildings, roads and traffic", "Trees help reduce urban heat in summer."], ["habitat", "the natural home of an animal or plant", "Green roofs provide a habitat for bees."], ["sustainable", "able to continue without damaging the environment", "Sustainable buildings use less energy and water."]]}], "vocab_sets": [{"title": "Set A – Is Your Smart Home Watching You?", "theme": "Pushing Boundaries", "text": "Smart homes promise a life of comfort. Lights switch on as you enter a room, the air conditioning adjusts itself, and the fridge can even order groceries when supplies run low. This kind of [1] saves time and, according to manufacturers, is highly [2] because it reduces electricity bills over the long term. But there is a price to pay. Every time a smart device listens to your voice or records your movements, information about you is stored in a company [3]. Critics warn that this could threaten our [4], since we rarely know who can access our data or how it will be used. Another problem is the constant flow of notifications. Many families say that phones and speakers create endless [5], making it harder to concentrate on homework or enjoy a conversation over dinner. None of this means that we should reject technology completely. However, before filling our homes with gadgets, we should think carefully about the long-term consequences and decide which devices genuinely make our lives better.", "gaps": [{"opts": ["automation", "voyage", "destination"], "why": "Machines doing tasks automatically (lights, air conditioning, ordering) = automation."}, {"opts": ["cost-effective", "heritable", "significant"], "why": "It ‘reduces electricity bills’ → good value for money = cost-effective."}, {"opts": ["database", "consequence", "freedom"], "why": "Information is ‘stored’ in an organised computer system = database."}, {"opts": ["privacy", "biodiversity", "infrastructure"], "why": "Not knowing ‘who can access our data’ is a threat to privacy."}, {"opts": ["distractions", "destinations", "voyages"], "why": "Things that make it ‘harder to concentrate’ = distractions."}]}, {"title": "Set B – Building Cities for Tomorrow", "theme": "Rise to the Challenge!", "text": "By 2050, nearly 70% of the world’s population is expected to live in cities. This rapid [1] brings exciting opportunities, but it also creates serious problems. In many [2], millions of commuters face hours of traffic [3] every day, and the air is often thick with pollution. To cope, city planners are developing [4] solutions. Singapore, for example, has covered many buildings with plants in order to increase [5] and give birds and insects new places to live. Other cities are upgrading their infrastructure, including better drainage systems to prevent flooding during heavy rain. Even schools are changing: some new classrooms are designed for kinaesthetic learners, with plenty of space to move around, while others use special insulation to reduce noise for auditory learners. Meanwhile, planners are experimenting with car-free zones and cheaper public transport to encourage people to leave their cars at home. The challenge is enormous, but with creativity and careful planning, the cities of tomorrow could be greener, healthier places to live.", "gaps": [{"opts": ["urbanisation", "insulation", "vegetation"], "why": "More people living in cities = urbanisation."}, {"opts": ["megacities", "habitats", "databases"], "why": "Huge cities with ‘millions of commuters’ = megacities."}, {"opts": ["congestion", "drainage", "biodiversity"], "why": "Too much traffic = traffic congestion (a common collocation)."}, {"opts": ["innovative", "auditory", "heritable"], "why": "New, creative solutions = innovative solutions."}, {"opts": ["biodiversity", "privacy", "automation"], "why": "More ‘birds and insects’ = more variety of living things = biodiversity."}]}], "grammar_points": [{"code": "G.5.1", "name": "Zero conditional", "rule": "<b>If / When + present simple, present simple<\/b>. Use it for general truths, facts and things that always happen.", "examples": ["<u>If<\/u> you <u>heat<\/u> ice, it <u>melts<\/u>.", "<u>When<\/u> plants <u>don’t get<\/u> water, they <u>die<\/u>."], "check": {"q": "If it ____ heavily, the soil on a living roof absorbs the water.", "opts": ["rains", "will rain", "rained"], "why": "Zero conditional: present simple in BOTH clauses."}}, {"code": "G.1.2", "name": "Comparative adjectives", "rule": "Short adjectives: <b>-er than<\/b> (cooler, bigger). Long adjectives: <b>more / less … than<\/b>. Irregular: good → better, bad → worse, far → further. Make them stronger with <b>much / far / a lot<\/b>; equal with <b>as … as<\/b>. Never ‘more better’.", "examples": ["Living roofs are <u>much cooler than<\/u> ordinary roofs.", "Small towns are <u>less crowded than<\/u> megacities."], "check": {"q": "Green roofs are ____ than ordinary roofs at absorbing rain.", "opts": ["much better", "more better", "the best"], "why": "good → better; strengthen with ‘much’. ‘more better’ is always wrong."}}, {"code": "G.2.9", "name": "Adverbs of quantity", "rule": "They say <b>how much<\/b> an action happens: <b>a lot, much (negatives/questions), a little, a bit, hardly, enough, more, less<\/b>. They usually come after the verb or object.", "examples": ["The temperature dropped <u>a lot<\/u>.", "It <u>hardly<\/u> rains in summer.", "We don’t travel <u>much<\/u>."], "check": {"q": "The temperature inside dropped ____ after we installed the living roof.", "opts": ["a lot", "many", "lots of"], "why": "After a verb, use the adverb ‘a lot’. ‘many / lots of’ need a noun."}}, {"code": "G.10.1", "name": "Present simple passive", "rule": "<b>am / is / are + past participle<\/b>. Very common for describing <b>processes<\/b> and facts when the doer is not important.", "examples": ["Rainwater <u>is absorbed<\/u> by the plants.", "A waterproof layer <u>is placed<\/u> under the soil."], "check": {"q": "Special waterproof layers ____ under the soil.", "opts": ["are placed", "place", "are placing"], "why": "The layers don’t place themselves → passive: are + placed."}}, {"code": "G.17.4", "name": "Indirect questions", "rule": "Start politely: <b>Could you tell me / Do you know / I wonder / I’d like to know<\/b> + question word + <b>subject + verb<\/b> (normal word order, NO do/does/did). Yes/no questions use <b>if / whether<\/b>.", "examples": ["Where <i>is<\/i> the station? → Could you tell me where <u>the station is<\/u>?", "Does it cost much? → I wonder <u>if it costs<\/u> much."], "check": {"q": "Could you tell me ____?", "opts": ["how a living roof works", "how does a living roof work", "how works a living roof"], "why": "Indirect question → normal order (subject + verb), no ‘does’."}}, {"code": "G.2.5", "name": "Adverbial linkers", "rule": "Link sentences: <b>contrast<\/b> however, nevertheless, on the other hand, even so; <b>addition<\/b> moreover, furthermore, in addition; <b>result<\/b> therefore, as a result, consequently. Usually at the start of a sentence followed by a comma.", "examples": ["Living roofs are expensive. <u>However<\/u>, they save money over time.", "They cool the building. <u>As a result<\/u>, energy bills fall."], "check": {"q": "Living roofs are expensive to install. ____, they save money in the long term.", "opts": ["However", "Therefore", "Moreover"], "why": "Expensive vs save money = contrast → However."}}, {"code": "G.2.2", "name": "Sequencing adverbs", "rule": "Show the order of steps: <b>First(ly), To begin with → Then, Next, After that, Secondly → Finally, Lastly<\/b>. <b>Eventually<\/b> = in the end, after a long time.", "examples": ["<u>First<\/u>, check the roof is strong. <u>Next<\/u>, add a waterproof layer. <u>Finally<\/u>, plant the vegetation."], "check": {"q": "____, engineers check the roof. Then, they add a waterproof layer.", "opts": ["First", "Finally", "Eventually"], "why": "The first step in the process → First."}}], "grammar_text": {"title": "My Roof Is Alive!", "text": "Have you ever wondered [1] some buildings have grass and flowers growing on top of them? These are living roofs, and they are becoming increasingly popular in cities around the world. Building one is a careful process. [2], engineers check that the rooftop is strong enough to carry the extra weight. Next, a waterproof layer and a drainage system are installed, and finally, soil and vegetation are added. Living roofs offer many benefits. If it rains heavily, the plants and soil [3] much of the water, which reduces the risk of flooding. They also provide natural insulation, so the building below stays [4] in summer than a building with an ordinary roof. In addition, living roofs create a habitat for birds, bees and butterflies, increasing biodiversity in urban areas. [5], they are not perfect. They are expensive to install, and they need regular care, especially in hot, dry climates like ours. Even so, many experts believe that living roofs are one of the most sustainable ways to fight urban heat, and several new buildings in the UAE are already testing them.", "gaps": [{"opts": ["why", "why do", "why are"], "code": "G.17.4", "why": "Indirect question after ‘wondered’ → normal word order, no ‘do’: why some buildings have …"}, {"opts": ["First", "Finally", "Eventually"], "code": "G.2.2", "why": "It is the first step, followed by ‘Next’ and ‘finally’."}, {"opts": ["absorb", "will have absorbed", "absorbed"], "code": "G.5.1", "why": "General truth with ‘If’ + present simple → present simple in the result clause (zero conditional)."}, {"opts": ["much cooler", "more cool", "coolest"], "code": "G.1.2", "why": "Comparative with ‘than’: cool → cooler; strengthened with ‘much’."}, {"opts": ["However", "Therefore", "As a result"], "code": "G.2.5", "why": "Benefits → ‘they are not perfect’ = contrast → However."}]}, "reading": [{"id": "reading-a", "part": "Part 3A", "level": "At Grade Level Goal (B2.2, argumentative)", "marks": 3, "theme": "Pushing Boundaries – Personality: Nature or Nurture?", "title": "Personality: Born or Made?", "paras": ["Are we born with our personalities, or are they shaped by the world around us? This question, often described as the ‘nature versus nurture’ debate, has fascinated scientists and philosophers for centuries. Today, thanks to advances in genetics and psychology, we have better evidence than ever before – and that evidence suggests that the answer is not one or the other, but both.", "Some of the most convincing evidence for nature comes from studies of identical twins who were separated at birth and raised by different families. Despite growing up in completely different environments, many of these twins turn out to be remarkably similar in temperament. Some share the same sense of humour, the same level of shyness, or even the same unusual habits. Researchers now estimate that roughly 40 to 50 per cent of the differences in personality between people are heritable.", "However, this also means that around half of those differences are not explained by genes. Our experiences – the way our parents raise us, the friends we make, the culture we grow up in and the challenges we face – play a significant role. A naturally shy child who is gently encouraged to try new activities may grow into a confident adult, while a child with the same genes who is constantly criticised may become even more withdrawn.", "Moreover, scientists have discovered that genes and environment are not completely separate. Our surroundings can influence which genes are ‘switched on’ or ‘off’, and our genetic tendencies can affect which environments we choose. An adventurous teenager, for instance, is more likely to seek out exciting experiences, which in turn strengthen that adventurous side.", "Why does this matter? If personality were entirely fixed at birth, there would be little point in trying to change. The evidence, however, points to a far more hopeful conclusion. While we cannot choose our genes, we can choose many of our habits, our friends and the challenges we take on. In other words, our personality is not a finished product but a work in progress – and each of us has a say in how it develops."], "qs": [{"skill": "Specific information", "q": "According to researchers, roughly what percentage of personality differences are heritable?", "opts": ["40–50%", "10–20%", "80–90%"], "why": "Paragraph 2: ‘roughly 40 to 50 per cent … are heritable’."}, {"skill": "Details", "q": "What surprising finding comes from studies of identical twins raised apart?", "opts": ["They are often very similar in temperament.", "They always become shy adults.", "They usually choose the same career."], "why": "Paragraph 2: ‘remarkably similar in temperament’. Careers are never mentioned."}, {"skill": "Details", "q": "According to paragraph 3, what may happen to a shy child who is gently encouraged?", "opts": ["They may become a confident adult.", "They may become even more withdrawn.", "They may lose their natural personality."], "why": "‘Withdrawn’ describes the child who is constantly criticised – a distractor."}, {"skill": "Details", "q": "What does paragraph 4 say about genes and environment?", "opts": ["They influence each other.", "They are completely separate.", "Environment is always more important."], "why": "‘genes and ng a wider motorway through the city centre", "Closing small local shops to build a large mall"], "why": "The writer suggests ‘green spaces and walkable neighbourhoods that recreate a village atmosphere’."}, {"skill": "Overall meaning", "q": "Which sentence best summarises the text?", "opts": ["Megacities and small towns both have strengths and weaknesses, and each can learn from the other.", "Families should leave megacities as soon as possible.", "Small towns will soon disappear because of urbanisation."], "why": "The text presents both sides and concludes they should ‘learn from the other’."}]}], "summary": {"label": "4.1 Compare & summarise", "title": "Smart Homes: Convenience or Concern?", "paras": ["Supporters of smart homes believe that they represent the future of comfortable, efficient living. Smart thermostats learn a family’s daily routine and adjust the temperature automatically, which can significantly reduce energy bills. Security cameras and smart locks can be controlled from a phone, giving homeowners peace of mind when they are away. For elderly people or those with disabilities, voice-controlled devices can make everyday tasks much easier, allowing them to live independently for longer. In the supporters’ view, automation simply frees people from boring chores so that they can spend more time on the things that really matter.", "Critics, on the other hand, argue that these benefits come at a significant cost. Smart devices constantly collect data about when we wake up, what we watch and even what we say, and this information is stored in company databases that could be hacked or sold. Critics also point out that homes full of connected gadgets can be surprisingly fragile: a power cut or a software failure may leave residents unable to open their own front door. Finally, some worry that relying on technology for every small decision could make us less independent, not more."], "question": "Read the text. Compare and contrast the two points of view presented. Summarise the main ideas in your own words. Write 4–5 sentences.", "min": 4, "max": 5, "ideas": ["Supporters: comfort and efficiency – saves energy and money.", "Supporters: better security; helps elderly/disabled people live independently; frees time.", "Critics: privacy – data is collected and could be hacked or sold.", "Critics: fragile – power cuts or software failures can lock people out.", "Critics: we may become too dependent on technology (contrast with supporters’ ‘freedom’)."], "model": "The text presents two opposing views about smart homes. On the one hand, supporters believe these homes make life more comfortable and efficient, since devices can save energy, improve security and help elderly or disabled people live independently. On the other hand, critics are concerned about privacy, because the data that devices collect could be stolen or sold. They also argue that smart homes may stop working during power cuts or technical failures. While supporters see automation as giving people more freedom, critics fear that it could make us too dependent on technology.", "rubric": [["Both points of view summarised (main ideas)", 6], ["Compares/contrasts with linkers (whereas, on the other hand…)", 3], ["Own words – paraphrased", 3], ["Accuracy: grammar, spelling, punctuation", 3]]}, "essay": {"label": "4.2 Comparative essay", "type": "comparative essay", "intro": "More and more young people around the world are choosing between life in a huge city and life in a smaller town.", "task": "Write an essay about where young people should live in the future, in which you compare life in a megacity with life in a small town:", "bullets": ["compare the advantages and disadvantages of living in a megacity and in a small town.", "explain which place you would prefer to live in, giving clear reasons.", "support your choice with examples, e.g. from the UAE or other countries."], "min_words": 220, "planner": [["Introduction", "Introduce the topic (urbanisation) + say you will compare both places."], ["Body 1 – Megacity", "Advantages (jobs, universities, culture) vs disadvantages (congestion, cost, pollution)."], ["Body 2 – Small town", "Advantages (community, cleaner air, cheaper) vs disadvantages (fewer services, fewer jobs)."], ["Body 3 – My preference", "Which place + 2 reasons + a real example."], ["Conclusion", "Summarise the comparison + final thought."]], "phrases": [["FL.26 Comparing", ["Both … and … offer …", "Similarly, / Likewise, …", "In the same way, …", "X is far more … than Y.", "X is not as … as Y.", "Compared with …, …"]], ["FL.26 Contrasting", ["On the one hand, … On the other hand, …", "Whereas / While megacities …, small towns …", "In contrast, …", "Unlike …, …", "The main difference between X and Y is …", "Despite / In spite of …"]], ["Giving your view", ["Personally, I would prefer … because …", "I am convinced that …", "From my perspective, …", "For this reason, …"]], ["Cohesion (ENG.09.WR.S.5.1)", ["Furthermore, / Moreover, …", "As a result, / Consequently, …", "This means that …", "Such problems …", "These advantages …", "In conclusion, / Ultimately, …"]]], "model": ["As urbanisation continues to grow, young people today face an important decision: should they build their future in a busy megacity or in a peaceful small town? Both options have clear advantages and disadvantages.", "On the one hand, megacities such as Tokyo or London offer an enormous range of opportunities. They have world-class universities, thousands of jobs and exciting cultural events. However, these benefits come at a price. Traffic congestion and pollution are serious problems, and housing is often so expensive that many young people struggle to save money.", "Small towns, in contrast, offer a calmer and more affordable lifestyle. The air is cleaner, people know their neighbours, and there is a stronger sense of community. Nevertheless, small towns are not as well equipped as big cities. There are fewer specialist hospitals and u const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, html="") => { const e=document.createElement(tag); for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; return e; };
const store = { get(k,d){ try{const v=localStorage.getItem("g12rev:"+D.short+":"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{localStorage.setItem("g12rev:"+D.short+":"+k, JSON.stringify(v));}catch(e){} } };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }
// stable shuffle
function seedRand(str){ let x=0; for(const c of str) x=(x*31+c.charCodeAt(0))|0; return ()=>{ x^=x<<13; x^=x>>17; x^=x<<5; return ((x>>>0)%10000)/10000; }; }
function shuffled(arr, seed){ const r=seedRand(seed); const a=arr.map((v,i)=>({v,i})); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------------- score state ---------------- */
// sections: id -> {marks per q, questions: {qid: correct(bool)}}
const S = { sections:{}, answers: store.get("answers", {}) };
function regSection(id, name, perQ, count, mock, skillOf){ S.sections[id]={name,perQ,count,mock,skillOf:skillOf||{}}; }
function record(qid, ok){ S.answers[qid]=ok; store.set("answers",S.answers); refreshScores(); }
function secScore(id){ const s=S.sections[id]; let got=0, done=0; for(let i=0;i<s.count;i++){ const v=S.answers[id+":"+i]; if(v!==undefined){done++; if(v) got+=s.perQ;} } return {got,done,max:s.perQ*s.count}; }
function refreshScores(){
  let mock=0, done=0, total=0;
  for(const id in S.sections){ const s=S.sections[id], r=secScore(id);
    const el=document.querySelector(`[data-sec="${id}"]`); if(el) el.innerHTML=`<span>Your score: <b>${r.got}</b> / ${r.max}</span><span class="small muted">${r.done} of ${s.count} answered</span>`;
    if(s.mock) mock+=r.got; done+=r.done; total+=s.count; }
  $("#mockTop").textContent=mock; $("#mockBar").style.width=(mock/60*100)+"%";
  $("#answeredTop").textContent=`${done} / ${total} practice questions answered`;
  if(typeof renderScorePage==="function") renderScorePage();
}

/* ---------------- MCQ builder ---------------- */
function mcq(container, qid, opts, why, {inline=false, onAnswer=null}={}){
  const order = shuffled(opts, qid);
  const box = h("div",{class:"opts"+(inline?" inline":"")});
  const w = h("div",{class:"why"});
  const answer = (pickIdx, silent) => {
    [...box.children].forEach((b,k)=>{ b.disabled=true; const orig=order[k].i; if(orig===0) b.classList.add("ok"); else if(k===pickIdx) b.classList.add("bad"); });
    const ok = order[pickIdx].i===0;
    w.innerHTML = (ok?'<b class="okt">✓ Correct.</b> ':'<b class="badt">✗ Not quite.</b> The answer is <b>'+"ABC"[order.findIndex(o=>o.i===0)]+'</b>. ')+why;
    w.classList.add("show");
    if(onAnswer) onAnswer(ok, order[pickIdx].v);
    if(!silent) record(qid, ok);
  };
  order.forEach((o,k)=>{ box.appendChild(h("button",{class:"opt",onclick:()=>answer(k)},`<span class="L">${"ABC"[k]}</span><span>${esc(o.v)}</span>`)); });
  container.append(box,w);
  // restore
  if(S.answers[qid]!==undefined && store.get("pick:"+qid,null)!==null){ answer(store.get("pick:"+qid), true); }
  box.addEventListener("click",e=>{ const b=e.target.closest(".opt"); if(b){ store.set("pick:"+qid,[...box.children].indexOf(b)); } }, true);
}
function resetSection(id){ const s=S.sections[id]; for(let i=0;i<s.count;i++){ delete S.answers[id+":"+i]; store.set("pick:"+id+":"+i,null);} store.set("answers",S.answers); build(); go(location.hash.slice(1)||"overview"); toast("Section reset – try again!"); }

/* ---------------- gap fill ---------------- */
function gapFill(parent, id, title, text, gaps, perQ, mock, tagFn){
  regSection(id, title, perQ, gaps.length, mock);
  const wrap=h("div",{class:"grid2"});
  const pas=h("div",{class:"passage"});
  pas.innerHTML=`<h3>${esc(title)}</h3><p>`+esc(text).replace(/\[(\d)\]/g,(m,n)=>`<span class="gap" id="${id}-g${n}">(${n}) ________</span>`)+`</p>`;
  const qs=h("div");
  gaps.forEach((g,i)=>{
    const q=h("div",{class:"q"});
    q.innerHTML=`<div class="qh"><div class="num">${i+1}</div><div class="qt">Gap (${i+1}) ${tagFn?'<span class="tag">'+tagFn(g)+'</span>':''}</div></div>`;
    mcq(q, id+":"+i, g.opts, g.why, {inline:true, onAnswer:(ok,val)=>{ const gp=$("#"+id+"-g"+(i+1), pas); gp.textContent=`(${i+1}) ${val}`; gp.className="gap "+(ok?"ok":"bad"); }});
    qs.appendChild(q);
  });
  wrap.append(pas,qs);
  parent.appendChild(wrap);
  const sc=h("div",{class:"secscore","data-sec":id});
  const rb=h("button",{class:"btn ghost small",onclick:()=>resetSection(id)},"↺ Try again");
  const holder=h("div",{class:"row",style:"justify-content:space-between;margin-top:6px"}); holder.append(sc,rb);
  sc.style.flex="1";
  parent.appendChild(holder);
}

/* ---------------- views ---------------- */
const VIEWS=[["overview","Overview"],["vocabulary","Vocabulary"],["grammar","Grammar"],["reading-a","Reading 3A"],["reading-b","Reading 3B"],["writing","Writing"],["tips","Exam tips"],["score","My score"]];

function build(){
  const main=$("#main"); main.innerHTML=""; S.sections={};
  $("#ttl").textContent=D.grade+" — Final Exam Revision";
  $("#chips").innerHTML=[D.stage, "CEFR "+D.cefr, ...D.themes.map(t=>"Theme: "+t)].map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  $("#nav").innerHTML=VIEWS.map(([id,n])=>`<a href="#${id}" data-v="${id}">${n}</a>`).join("");
  VIEWS.forEach(([id])=>main.appendChild(h("section",{class:"view",id:"v-"+id})));

  /* OVERVIEW */
  const ov=$("#v-overview");

/* ---------------- writing ---------------- */
function counts(t){ const words=(t.trim().match(/[A-Za-z0-9’'-]+/g)||[]).length; const sents=(t.match(/[^.!?]+[.!?]+/g)||[]).filter(s=>s.trim().length>2).length; const paras=t.split(/\n\s*\n/).filter(p=>p.trim()).length; return {words,sents,paras}; }
function rubricTable(parent, key, rows, total, label){
  const t=h("table",{class:"rub"});
  const saved=store.get("rub:"+key,{});
  rows.forEach((r,i)=>{ const tr=h("tr"); tr.innerHTML=`<td>${esc(r[0])}</td><td style="text-align:right;white-space:nowrap"></td>`;
    const sel=h("select"); for(let k=0;k<=r[1];k++) sel.appendChild(h("option",{value:k},k)); sel.value=saved[i]||0;
    sel.onchange=()=>{ const s=store.get("rub:"+key,{}); s[i]=+sel.value; store.set("rub:"+key,s); upd(); refreshScores(); };
    tr.lastChild.append(sel, document.createTextNode(" / "+r[1])); t.appendChild(tr); });
  const tot=h("tr",{class:"tot"}); tot.innerHTML=`<td>${label}</td><td style="text-align:right"><span></span> / ${total}</td>`; t.appendChild(tot);
  const upd=()=>{ const s=store.get("rub:"+key,{}); tot.querySelector("span").textContent=rows.reduce((a,_,i)=>a+(s[i]||0),0); };
  upd(); parent.appendChild(t);
}
function writingScore(){ let s=0; ["sum","ess"].forEach(k=>{ const v=store.get("rub:"+k,{}); for(const i in v) s+=v[i]; }); return s; }
function buildWriting(){

  ta.oninput=upd1; right.append(ta,ct); upd1();

  const m1=h("div",{class:"model"},`<b>Model answer</b><p style="margin-top:6px">${esc(S1.model)}</p>`);

  rubricTable(right,"sum",S1.rubric,15,"4.1 total");

  // 4.2
  const c2=h("div",{class:"card"});
  c2.innerHTML=`<h3>${esc(E.label)} <span class="tag">25 marks</span></h3>
   <div class="prompt"><i>${esc(E.intro)}</i><p style="margin:8px 0 0"><b>${esc(E.task)}</b></p><ul>${E.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul><b>Write at least ${E.min_words} words in paragraphs.</b></div>`;
  const g2=h("div",{class:"grid2"});

  L.appendChild(h("p",{class:"small",style:"font-weight:700;margin:0 0 6px"},"Step 1 · Plan (not marked)"));
  E.planner.forEach((p,i)=>{ L.appendChild(h("div",{class:"small",style:"font-weight:700;margin-top:8px"},esc(p[0])+` <span class="muted" style="font-weight:500">– ${esc(p[1])}</span>`)); const t=h("textarea",{class:"plan",placeholder:"Notes…"}); t.value=store.get("plan:"+i,""); t.oninput=()=>store.set("plan:"+i,t.value); L.appendChild(t); });
  L.appendChild(h("p",{class:"small",style:"font-weight:700;margin:16px 0 4px"},"Useful language – click a phrase to add it to your essay"));
  const essay=h("textarea",{placeholder:"Step 2 · Write your essay here. Leave an empty line between paragraphs.",style:"min-height:420px"});
  E.phrases.forEach(([grp,list])=>{ L.appendChild(h("div",{class:"small muted",style:"font-weight:700"},esc(grp))); const pr=h("div",{class:"phr"}); list.forEach(p=>pr.appendChild(h("button",{onclick:()=>{ const ins=p.replace(/\s*…\s*$/,"")+" "; const s=essay.selectionStart??essay.value.length; essay.value=essay.value.slice(0,s)+ins+essay.value.slice(essay.selectionEnd??s); essay.focus(); essay.selectionStart=essay.selectionEnd=s+ins.length; upd2(); }},esc(p)))); L.appendChild(pr); });

  essay.oninput=upd2; R.append(essay,ct2); upd2();
  const rowb=h("div",{class:"row",style:"margin:8px 0 12px"});

  R.appendChild(rowb);

  const ck2=store.get("ck:ess",{});
  checks.forEach((c,i)=>{ const l=h("label",{class:"check"}); const cb=h("input",{type:"checkbox"}); cb.checked=!!ck2[i]; cb.onchange=()=>{const s=store.get("ck:ess",{}); s[i]=cb.checked; store.set("ck:ess",s);}; l.append(cb,h("span",{},esc(c))); R.appendChild(l); });
  const m2=h("div",{class:"model"},`<b>Model ${esc(E.type)}</b> <span class="small muted">(${counts(E.model.join("\n\n")).words} words)</span>`+E.model.map(p=>`<p style="margin-top:8px">${esc(p)}</p>`).join(""));
  R.appendChild(h("div",{class:"row",style:"margin-top:10px"})).append(h("button",{class:"btn",onclick:()=>m2.classList.toggle("show")},"👀 Show / hide model essay"));

  v.appendChild(c3);
}

/* ---------------- tips ---------------- */
function buildTips(){
  const adv=D.short.includes("Advanced");
  const T=[
    ["🔤","Part 1 · Vocabulary gap fill",["Read the WHOLE text first to understand the topic.","Look at the words just before and after the gap: is it a noun, verb, adjective or phrase?","Check grammar clues: <i>a / an</i>, plural <i>-s</i>, prepositions (e.g. <i>raise ___</i>, <i>traffic ___</i>).","Try each option in the gap and read the sentence aloud in your head.","Look for clues in the next sentence: writers often explain the gap word later."]],
    ["🧩","Part 2 · Grammar gap fill",["Decide which grammar point is being tested (passive? conditional? linker?).","Check tense clues: <i>now, right now, every day, last week, if</i>.","Commas around a clause → non-defining relative (<i>which / who</i>, never <i>that</i>).","Linkers: is the next idea a contrast, an addition or a result?","Reread the full sentence with your answer before moving on."]],
    ["🔎","Specific information & Details",["Underline the key words in the question.","Scan the text for those words or synonyms (the text often uses different words).","Read the sentence before and after carefully.","Watch for distractors: numbers, names or words from the text that are in the WRONG place."]],
    ["💡","Main point / Overall meaning",["Main point of a paragraph: read its first and last sentences (topic sentence).","Overall meaning: think about the title, the introduction and the conclusion.","Avoid answers that are too narrow (only one detail) or too extreme (<i>always, never, all</i>)."]],
    ["🕵️","Inference",["The answer is NOT written directly – you must use clues.","Ask: what does the writer suggest or imply?","The correct answer must be supported by the text; don’t use only your own opinion.","For ‘what would the writer advise…’, apply the writer’s main idea to the new situation."]],
    ["🎭","Mood, tone & attitude",["Look for opinion words: adjectives and adverbs (<i>surprisingly, sadly, hopeful, outdated</i>).","Notice time words that show a change: <i>at first … but now</i>.","Common tones: critical, balanced, hopeful, worried, humorous, neutral."]],
    ["🌍","Connections",["The question links the text to the real world, another situation or your own experience.","First decide what the text’s main idea or suggestion is.","Then choose the example that matches that idea most closely."]],
    ["📝","4.1 "+(adv?"Compare & summarise":"Summary"),[adv?"Find the TWO points of view (usually one per paragraph).":"Find the main idea in each part of the text.", "Use your own words – change vocabulary and sentence structure. Do NOT copy sentences.", adv?"Use comparing/contrasting linkers: <i>whereas, while, on the other hand, in contrast</i>.":"Leave out examples and small details.", "Write exactly 4–5 sentences."]],
    ["🖋️","4.2 "+(adv?"Comparative essay (220+ words)":"Opinion essay (200+ words)"),["Spend 5 minutes planning: one paragraph for each bullet point.","Introduction → body paragraphs → conclusion.","Answer EVERY bullet point – missing one costs a lot of marks.","Start each paragraph with a clear topic sentence.", adv?"Compare in every paragraph and give your preference with reasons and examples.":"Give your opinion clearly and support it with reasons and examples.","Save 3–5 minutes to check spelling, punctuation and word count."]],
    ["⏱️","On exam day",["Read every instruction carefully.","Don’t spend too long on one question – mark it and come back.","Answer every multiple-choice question; there is no penalty for guessing.","Check that you have chosen only ONE answer per question."]],
  ];
  const v=$("#v-tips"); v.innerHTML=`<div class="h2">Exam tips by question type</div><p class="sub">Each reading question in your exam tests one of these skills. Learn how to approach each type.</p>`;
  const g=h("div",{class:"grid2"});
  T.forEach(([ic,t,list])=>{ const c=h("div",{class:"card tip"}); c.innerHTML=`<h4><span>${ic}</span>${t}</h4><ul class="small">${list.map(x=>`<li>${x}</li>`).join("")}</ul>`; g.appendChild(c); });
  v.appendChild(g);
}

/* ---------------- score page ---------------- */
function renderScorePage(){
  const el=$("#scoreBody"); if(!el) return;
  let mock=0; const rows=[];
  for(const id in S.sections){ const s=S.sections[id], r=secScore(id); if(s.mock) mock+=r.got; rows.push([s.name+(s.mock?"":" (extra)"), r.got, r.max, r.done, s.count]); }
  const ws=writingScore();
  // skills
  const sk={};
  ["reading-a","reading-b"].forEach(id=>{ const s=S.sections[id]; if(!s) return; for(const i in s.skillOf){ const k=s.skillOf[i]; sk[k]=sk[k]||{ok:0,done:0,tot:0}; sk[k].tot++; const v=S.answers[id+":"+i]; if(v!==undefined){ sk[k].done++; if(v) sk[k].ok++; } } });
  el.innerHTML=`<div class="bigstat" style="margin-bottom:18px"><div><span class="small muted">Mock exam (Parts 1–3)</span><b>${mock} / 60</b></div><div><span class="small muted">Writing (self-marked)</span><b>${ws} / 40</b></div><div><span class="small muted">Estimated total</span><b>${mock+ws} / 100</b></div></div>
  <div class="grid2"><div class="card"><h3>By section</h3><table class="ov"><thead><tr><th>Section</th><th>Answered</th><th style="text-align:right">Score</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="small muted">${r[3]} / ${r[4]}</td><td class="m">${r[1]} / ${r[2]}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h3>Reading by question type</h3><p class="small muted" style="margin-top:-4px">Your weakest type is the one to practise next.</p>${Object.entries(sk).map(([k,v])=>`<div class="skillbar"><span>${esc(k)}</span><span class="prog"><i style="width:${v.done?v.ok/v.done*100:0}%"></i></span><span class="small muted">${v.ok}/${v.done||0}</span></div>`).join("")}
  <div class="row" style="margin-top:16px"><button class="btn" id="resetAll">↺ Reset all answers</button></div></div></div>`;
  $("#resetAll").onclick=()=>{ for(const id in S.sections){ for(let i=0;i<S.sections[id].count;i++){ delete S.answers[id+":"+i]; store.set("pick:"+id+":"+i,null);} } store.set("answers",S.answers); build(); go("score"); toast("All multiple-choice answers reset"); };
}

/* ---------------- routing ---------------- */
function go(id){ if(!VIEWS.some(v=>v[0]===id)) id="overview"; document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+id)); document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===id)); }
window.addEventListener("hashchange",()=>{ go(location.hash.slice(1)); window.scrollTo({top:0}); });
build(); go(location.hash.slice(1)||"overview");
</script>
